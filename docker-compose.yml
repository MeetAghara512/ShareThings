services:
  server:
    build: ./server
    # Only reachable through the client's nginx (/socket.io/, /health)
    expose:
      - "5000"
    # Secrets come from your shell or a .env file next to this file, never from the image
    environment:
      - XIRSYS_IDENT
      - XIRSYS_SECRET
      - XIRSYS_CHANNEL
      - GMAIL_CLIENT_SECRET
      - GMAIL_REFRESH_TOKEN
      - INVITE_FROM_EMAIL
      # Empty: one server copy keeps everything in memory. Several copies work only once scale parts 1 and 2 are in
      # (limits, then rooms, seats and hosts shared through Redis); then set it to redis://redis:6379 and start the
      # redis service too: REDIS_URL=redis://redis:6379 docker compose --profile scale up --scale server=2
      - REDIS_URL

  # Optional shared state for several server copies; starts only with --profile scale
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"

  # Open http://localhost:3000. The app talks to the server through this container's nginx, so its
  # build needs no server address
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
