# WebSocket connections need these two headers passed on; plain requests close normally
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Signaling: the app connects to its own address (no REACT_APP_SOCKET_SERVER_URL in the build) and
    # nginx passes it on to the server container
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call keeps its connection open for as long as it lasts
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://server:5000;
    }

    # Single-page app: let React Router handle unknown paths such as /room/:id
    location / {
        try_files $uri /index.html;
    }
}
