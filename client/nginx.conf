# WebSocket connections need these two headers passed on; plain requests close normally
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers (the same list is set in Render's static-site Headers settings). The policy allows
    # only what the app loads: its own files and signaling, Tailwind from its CDN (inline styles), and
    # Google sign-in (script, stylesheet, button frame, status requests). Nothing else may run or frame it
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # Signaling: the app connects to its own address (no REACT_APP_SOCKET_SERVER_URL in the build) and
    # nginx passes it on to the server container
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The server limits requests per client address (server/limits.js), read from these headers. Set them
        # here, never pass on what the browser sent: otherwise a client could claim any address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call keeps its connection open for as long as it lasts
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://server:5000;
    }

    # Single-page app: let React Router handle unknown paths such as /room/:id
    location / {
        try_files $uri /index.html;
    }
}
